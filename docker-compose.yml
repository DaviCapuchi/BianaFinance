services:
  webapp:
    build: ./frontend
    container_name: web-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Protege as dependências do container
    environment:
      - CHOKIDAR_USEPOLLING=true # Garante que alterações em Linux/Windows reflitam na hora
    command: npm run dev -- --host 0.0.0.0

